name: Windows setup

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup:
    runs-on: windows-2025
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Install verified Inno Setup compiler
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.4.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_4/innosetup-6.7.4.exe' -OutFile $installer
          $signature = Get-AuthenticodeSignature -LiteralPath $installer
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Pyrsys B\.V\.') {
            throw 'The Inno Setup publisher signature could not be verified.'
          }
          $compilerDir = Join-Path $env:RUNNER_TEMP 'FromZero-Inno'
          $process = Start-Process $installer -ArgumentList @('/CURRENTUSER','/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/NOICONS',('/DIR="' + $compilerDir + '"')) -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Compiler installation failed ($($process.ExitCode))." }
          "ISCC_EXE=$(Join-Path $compilerDir 'ISCC.exe')" >> $env:GITHUB_ENV
      - name: Build and test the installer
        shell: pwsh
        env:
          FROMZERO_UPDATE_PRIVATE_KEY: ${{ secrets.FROMZERO_UPDATE_PRIVATE_KEY }}
        run: |
          ./scripts/build-setup.ps1 -Compiler $env:ISCC_EXE -UpdateAssets
          ./scripts/test-setup.ps1 -Installer ./dist/FromZero-Setup-win-x64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: FromZero-Setup-win-x64
          path: |
            dist/FromZero-Setup-win-x64.exe
            dist/FromZero-Setup-win-x64.exe.sha256
            dist/FromZero-update-win-x64.*
          if-no-files-found: error
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = (Get-Item -LiteralPath 'dist/FromZero-Setup-win-x64.exe').VersionInfo.ProductVersion.Trim()
          if ($version -notin @($env:GITHUB_REF_NAME.TrimStart('v'),($env:GITHUB_REF_NAME.TrimStart('v') + '.0'))) {
            throw "Setup version $version does not match $env:GITHUB_REF_NAME."
          }
          $parts = $version.Split('.')
          $notes = 'docs/SURUM-' + $parts[0] + '.' + $parts[1] + '.md'
          gh release create $env:GITHUB_REF_NAME dist/FromZero-Setup-win-x64.exe dist/FromZero-Setup-win-x64.exe.sha256 dist/FromZero-update-win-x64.json dist/FromZero-update-win-x64.sig dist/FromZero-update-win-x64.pack --verify-tag --title "FromZero $env:GITHUB_REF_NAME" --notes-file $notes
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
